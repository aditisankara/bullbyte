# Local development overrides — hot-reload for all application services.
# This file is automatically merged with docker-compose.yml by Docker Compose.
# NOT used in CI or production — base docker-compose.yml only in those environments.
services:

  frontend:
    build:
      context: ./frontend
      target: build
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "start", "--", "--host", "0.0.0.0", "--poll", "500"]
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4200', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./api
      target: build
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bullbyte
      REDIS_URL: redis://redis:6379
      ML_SIDECAR_URL: http://ml-sidecar:8000
      NESTJS_WEBHOOK_URL: http://api:3000/internal
    command: ["npm", "run", "start:dev"]

  ml-sidecar:
    volumes:
      - ./ml-sidecar:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bullbyte
      NESTJS_WEBHOOK_URL: http://api:3000/internal
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

